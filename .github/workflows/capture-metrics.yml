name: Capture monthly metrics

# The tables behind the KPI measures hold current state only, so a month that is never captured
# cannot be recovered afterwards. That is why this runs on five days rather than one: GitHub can
# delay or drop a scheduled run, and a day on which every measurement is already present exits
# cleanly, so the later days cost nothing and are there purely as retries.
on:
  schedule:
    # 08:00 UTC on the 1st to the 5th, for the month just ended. After 07:00 because every admin
    # response is output-cached until then -- running earlier would capture yesterday's figures.
    - cron: '0 8 1-5 * *'
  workflow_dispatch:
    inputs:
      period:
        description: 'First day of the month to capture, e.g. 2026-11-01. Defaults to the month just ended.'
        required: false
        type: string
      dry_run:
        description: 'Print the measurements and write nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Never two captures of the same period at once. The endpoint refuses a duplicate, but one of the
# two would then report a failure for work the other had done.
concurrency:
  group: capture-monthly-metrics
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      API_BASE: https://openactivemonitorapi.azurewebsites.net

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture the month
        env:
          # Both surfaces are read: the admin one for most of it, the analytics one for the
          # facility count. The tokens are not interchangeable.
          MONITOR_ADMIN_TOKEN: ${{ secrets.API_ADMIN_TOKEN }}
          MONITOR_ACCESS_TOKEN: ${{ secrets.API_ACCESS_TOKEN }}
          # Passed through the environment rather than interpolated into the command, so a
          # manually entered period cannot become part of the shell line.
          PERIOD: ${{ inputs.period }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--api-base "$API_BASE")
          if [ -n "$PERIOD" ]; then args+=(--period "$PERIOD"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/capture_month.py "${args[@]}"
