name: Run integration tests

env:
  DOTNET_VERSION: '10.x'
  CREDENTIALS_FILE: openactive-monitor-credentials.json

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Write BigQuery credentials file
        env:
          CREDS: ${{ secrets.BIGQUERY_CREDENTIALS_JSON }}
        run: printf '%s' "$CREDS" > "${{ env.CREDENTIALS_FILE }}"

      - name: Write appsettings.Development.json
        env:
          PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
          DATASET_ID: ${{ secrets.BIGQUERY_DATASET_ID }}
          ACCESS_TOKEN: ${{ secrets.API_ACCESS_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.API_ADMIN_TOKEN }}
        run: |
          cat > appsettings.Development.json <<EOF
          {
            "BigQuery": {
              "ProjectId": "$PROJECT_ID",
              "DatasetId": "$DATASET_ID",
              "Credentials": "${{ env.CREDENTIALS_FILE }}"
            },
            "Api": {
              "AccessToken": "$ACCESS_TOKEN",
              "AdminToken": "$ADMIN_TOKEN"
            }
          }
          EOF

      - name: Run analytics API tests
        run: dotnet test MonitorApi.Tests/MonitorApi.Tests.csproj --configuration Release

      - name: Run admin API tests
        run: dotnet test MonitorApi.Admin.Tests/MonitorApi.Admin.Tests.csproj --configuration Release
